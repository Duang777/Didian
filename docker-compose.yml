name: didian

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: didian
      POSTGRES_USER: ${POSTGRES_USER:-didian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-didian}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
